name: CI/CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile app_v2.py src/main.py src/fetchers/virustotal.py src/fetchers/abuseipdb.py src/fetchers/alienvaultotx.py

      - name: Validate package imports
        run: python -m compileall src

  release:
    name: Build Release Artifact
    runs-on: ubuntu-latest
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package source code
        run: |
          zip -r ThreatViz-${GITHUB_REF_NAME}.zip \
            app_v2.py \
            src \
            requirements.txt \
            README.md \
            .gitignore

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ThreatViz-${{ github.ref_name }}.zip
